services:
  db:
    image: postgres:16
    container_name: collabdocs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - collabdocs_postgres_data:/var/lib/postgresql/data

volumes:
  collabdocs_postgres_data: